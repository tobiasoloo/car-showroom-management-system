<!DOCTYPE html>
<html lang="en">
	<head>
		<title> Nested tables</title>
		<meta charset="utf-8">
	</head>
	<body>
		<h1>This is a nested table</h1>
		<!-- This is the outer table -->
		<table border="1" >
			<caption>Products from Sameer Group Company</caption>
			<tr>
				<th colspan="2">SAMEER GROUP</th>
			</tr>
			<tr>
				<td>
					<!-- First Inner Table on the left side-->
					<table border="1" >
						<caption> Vehicle Tyre Products</caption>
						<tr>
							<th colspan="2"> Tyres</th>
						</tr>
						<tr>
							<th>SIZE</th>
							<th>COST</th>
						</tr>
						<tr>
							<td>13"</td>
							<td>1500</td>
						</tr>
						<tr>
							<td>15"</td>
							<td>3000</td>
						</tr>
					</table><!--end of the first inner table on left side-->
				</td>
				<td>
					<!-- Seond inner table on the right side-->
					<table border="1" >
						<caption> Wheel cover products</caption>
						<tr>
							<th colspan="2">WHEEL CAPS</th>
						</tr>
						<tr>
							<th> SIZE</th>
							<th>COST</th>
						</tr>
						<tr>
							<td> Small</td>
							<td> 1800</td>
						</tr>
						<tr>
							<td>Medium</td>
							<td>2500</td>
						</tr>
					</table><!--end of second table on right side-->
				</td>
			</tr>
		</table><!-- end of outer table-->
	</body>
	</html>
