<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Interface - Car Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <a href="client.html">Client</a>
    <a href="admin.html">Admin</a>
  </nav>

  <!-- Admin Interface -->
  <section id="admin">
    <h1>Admin Interface</h1>

    <!-- Add/Remove Cars -->
    <div class="card">
      <h2>Manage Cars</h2>
      <form id="car-form">
        <input type="text" id="car-make" placeholder="Make" required>
        <input type="text" id="car-model" placeholder="Model" required>
        <input type="number" id="car-year" placeholder="Year" required>
        <input type="text" id="car-license" placeholder="License Plate" required>
        <input type="number" id="car-rate" placeholder="Daily Rate" required>
        <button type="submit">Add Car</button>
      </form>
      <ul id="admin-car-list"></ul>
    </div>

    <!-- View All Bookings -->
    <div class="card">
      <h2>All Bookings</h2>
      <ul id="admin-booking-list"></ul>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
